name: microduck-studio

x-microduck-image: &microduck-image
  image: microduck-studio-runtime:local
  build:
    context: .
    dockerfile: docker/microduck/Dockerfile
    additional_contexts:
      microduck_source: ${MICRODUCK_SIM_SOURCE:-../microduck}
    args:
      RUST_IMAGE: ${MICRODUCK_RUST_IMAGE:-rust:1.89-bookworm}
      ORT_VERSION: ${MICRODUCK_ORT_VERSION:-1.28.0}

services:
  robotd:
    <<: *microduck-image
    container_name: microduck-studio-robotd
    command:
      - robotd
      - --sim
      - ${MICRODUCK_BODY_HOST:-host.docker.internal}:${MICRODUCK_BODY_PORT:-7801}
      - --params
      - /config/robotd.toml
      - --socket
      - /runtime/robotd.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - runtime:/runtime
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/robotd.toml:/config/robotd.toml:ro
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/policies:/opt/robot/policies:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /runtime/robotd.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
    restart: "no"

  tofd:
    <<: *microduck-image
    container_name: microduck-studio-tofd
    command:
      - tofd
      - --sim
      - ${MICRODUCK_BODY_HOST:-host.docker.internal}:${MICRODUCK_BODY_PORT:-7801}
      - --config
      - /config/robotd.toml
      - --socket
      - /runtime/tofd.sock
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - runtime:/runtime
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/robotd.toml:/config/robotd.toml:ro
    healthcheck:
      test: ["CMD-SHELL", "test -S /runtime/tofd.sock"]
      interval: 1s
      timeout: 1s
      retries: 30
    restart: "no"

  studio:
    image: microduck-studio-web:local
    build:
      context: .
      dockerfile: docker/studio/Dockerfile
    container_name: microduck-studio-web
    depends_on:
      robotd:
        condition: service_healthy
      tofd:
        condition: service_healthy
    environment:
      MICRODUCK_REPO: /repos/microduck
      MICRODUCK_RL_REPO: /repos/microduck_rl
      MICRODUCK_ROBOTD_SOCKET: /runtime/robotd.sock
      MICRODUCK_TOFD_SOCKET: /runtime/tofd.sock
      MICRODUCK_BODY_HOST: ${MICRODUCK_BODY_HOST:-host.docker.internal}
      MICRODUCK_BODY_PORT: ${MICRODUCK_BODY_PORT:-7801}
      MICRODUCK_HEAD_CAMERA_PORT: ${MICRODUCK_HEAD_CAMERA_PORT:-7901}
      MICRODUCK_STUDIO_HOST: 0.0.0.0
      MICRODUCK_STUDIO_PORT: 8090
      MICRODUCK_STUDIO_ENABLE_JOBS: "false"
      MICRODUCK_STUDIO_RUNTIME: /state
      MICRODUCK_RUNTIME_REF: ${MICRODUCK_RUNTIME_REF:-unknown}
      MICRODUCK_RUNTIME_REVISION: ${MICRODUCK_RUNTIME_REVISION:-unknown}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: input
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:${MICRODUCK_STUDIO_PORT:-8090}:8090
    volumes:
      - runtime:/runtime
      - ${MICRODUCK_REPO:-../microduck}:/repos/microduck:ro
      - ${MICRODUCK_RL_REPO:-../microduck_rl}:/repos/microduck_rl:ro
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/jobs:/state/jobs
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/services:/state/services
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/simulator.json:/state/simulator.json:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/status', timeout=1)
      interval: 1s
      timeout: 2s
      retries: 30
    restart: "no"

  robotctl:
    <<: *microduck-image
    profiles: [tools]
    entrypoint: [robotctl]
    command: [--robot-socket, /runtime/robotd.sock, monitor]
    volumes:
      - runtime:/runtime

  mujoco-headless:
    profiles: [headless]
    image: microduck-studio-mujoco:local
    container_name: microduck-studio-mujoco
    build:
      context: .
      dockerfile: docker/microduck-rl/Dockerfile
      additional_contexts:
        microduck_rl_source: ${MICRODUCK_RL_REPO:-../microduck_rl}
    command:
      - --keyframe
      - HOME
      - --host
      - 0.0.0.0
      - --port
      - ${MICRODUCK_BODY_PORT:-7801}
      - --headless
      - --render
      - --render-width
      - ${MICRODUCK_RENDER_WIDTH:-1280}
      - --render-height
      - ${MICRODUCK_RENDER_HEIGHT:-720}
      - --render-fps
      - ${MICRODUCK_RENDER_FPS:-24}
      - --render-quality
      - ${MICRODUCK_RENDER_QUALITY:-95}
      - --cameras
      - a
      - --frame-port
      - ${MICRODUCK_HEAD_CAMERA_PORT:-7901}
    environment:
      MUJOCO_GL: ${MICRODUCK_MUJOCO_GL:-osmesa}
    ports:
      - 127.0.0.1:${MICRODUCK_BODY_PORT:-7801}:7801
      - 127.0.0.1:${MICRODUCK_HEAD_CAMERA_PORT:-7901}:7901
    volumes:
      - ${MICRODUCK_RUNTIME_DIR:-./.studio-runtime/dev-stack}/simulator.json:/config/simulator.json:ro
    restart: "no"

volumes:
  runtime:
    name: microduck-studio-runtime
    external: true
